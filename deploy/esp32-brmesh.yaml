# ESP32 bridge for BRMesh (FastCon BLE) lights.
#
# christmas-lights sends colours to this ESP32 over Wi-Fi (ESPHome's REST API);
# the ESP32 broadcasts them to the lights over Bluetooth.
#
# 1. Fill in deploy/secrets.yaml (copy secrets.example.yaml): Wi-Fi + mesh key.
# 2. Set each light_id below to the light's id from the BRMesh app (see README).
# 3. Plug the ESP32 into the server by USB and flash it:
#      pipx install esphome        (once)
#      esphome run deploy/esp32-brmesh.yaml
#    Later updates go over Wi-Fi with the same command.
# 4. In the app: Setup -> + Add Bluetooth pair, type the ESP32's IP.
#
# Keep the light names brmesh_1, brmesh_2, ... : the app addresses them by name.
# More lights: copy a light block, next name, its own light_id.

esphome:
  name: brmesh-bridge
  friendly_name: BRMesh bridge

esp32:
  board: esp32dev          # change to your board (e.g. esp32-s3-devkitc-1)
  framework:
    type: arduino
    # Flash these boards at 115200 baud (see README): at the default 460800
    # the first flash failed, and esptool misreported the crystal as 26 MHz.

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "BRMesh bridge setup"
    password: !secret fallback_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# REST API the app uses: POST /light/brmesh_1/turn_on?r=..&g=..&b=..
web_server:
  port: 80

esp32_ble_tracker:
esp32_ble_server:

external_components:
  - source: github://dennispg/esphome-fastcon@main

fastcon:
  mesh_key: !secret brmesh_mesh_key

light:
  - platform: fastcon
    id: brmesh_1
    name: "brmesh_1"
    light_id: 1             # from the BRMesh app
    default_transition_length: 0s
  - platform: fastcon
    id: brmesh_2
    name: "brmesh_2"
    light_id: 2             # from the BRMesh app
    default_transition_length: 0s
